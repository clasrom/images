<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Galería</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: rgb(16, 18, 17);
      font-family: 'Press Start 2P', monospace;
      color: #e0e0e0;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #7CFC00;
      text-shadow: 0 0 10px #3aff00;
    }

    /* GALERÍA */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
    }

    .gallery img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      cursor: pointer;
      border-radius: 8px;
      border: 3px solid #2f2f2f;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      transition: transform 0.2s, box-shadow 0.2s;
      image-rendering: pixelated;
    }

    .gallery img:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px #7CFC00;
    }

    /* LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .lightbox img {
      max-width: 80%;
      max-height: 80%;
      border: 6px solid #3a3a3a;
      border-radius: 10px;
      box-shadow: 0 0 30px #7CFC00;
      image-rendering: pixelated;
    }

    /* FLECHAS */
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 40px;
      color: #7CFC00;
      cursor: pointer;
      user-select: none;
      padding: 20px;
      background: #1a1a1a;
      border: 4px solid #3a3a3a;
      border-radius: 12px;
      box-shadow: 0 0 15px #000;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .arrow:hover {
      transform: translateY(-50%) scale(1.15);
      box-shadow: 0 0 20px #7CFC00;
    }

    .arrow.left { left: 30px; }
    .arrow.right { right: 30px; }

    .close {
      position: absolute;
      top: 25px;
      right: 30px;
      font-size: 30px;
      color: #ff4d4d;
      cursor: pointer;
      text-shadow: 0 0 10px #ff0000;
    }
  </style>
</head>
<body>

<h1>GALERÍA 
    LOS PANAS 3
</h1>

<!-- MINIATURAS -->
<div class="gallery">
  <img src="1.png" onclick="openLightbox(0)">
  <img src="2.png" onclick="openLightbox(1)">
  <img src="3.png" onclick="openLightbox(2)">
  <img src="4.png" onclick="openLightbox(3)">
  <img src="5.png" onclick="openLightbox(4)">
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span class="close" onclick="closeLightbox()">✖</span>
  <span class="arrow left" onclick="changeImage(-1)">◀</span>
  <img id="lightbox-img">
  <span class="arrow right" onclick="changeImage(1)">▶</span>
</div>

<script>
  const images = [
    '1.png',
    '2.png',
    '3.png',
    '4.png',
    '5.png'
  ];

  let currentIndex = 0;

  function openLightbox(index) {
    currentIndex = index;
    document.getElementById('lightbox-img').src = images[currentIndex];
    document.getElementById('lightbox').style.display = 'flex';
  }

  function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
  }

  function changeImage(direction) {
    currentIndex += direction;
    if (currentIndex < 0) currentIndex = images.length - 1;
    if (currentIndex >= images.length) currentIndex = 0;
    document.getElementById('lightbox-img').src = images[currentIndex];
  }
</script>

</body>
</html>
